name: build firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi make

      - name: Show files
        run: ls -R

      - name: Build
        run: make || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            **/*.bin
            **/*.elf
